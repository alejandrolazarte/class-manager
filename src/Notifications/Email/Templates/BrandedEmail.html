<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{Title}}</title>
<style>body{margin:0;background:#eef2f5}a{color:{{Primary}}}a:hover{color:{{PrimaryStrong}}}</style>
</head>
<body style="margin:0;background:#eef2f5">
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#eef2f5;font-family:Arial,Helvetica,sans-serif;color:#10212f">
<tr><td align="center" style="padding:32px 12px">
<span style="display:none;max-height:0;overflow:hidden">{{Preheader}}</span>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:100%;max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden">
<tr><td style="background:{{Primary}};padding:28px 32px">
<table role="presentation" cellpadding="0" cellspacing="0" border="0"><tr>
{{BrandBadge}}
<td style="padding-left:14px;white-space:nowrap;font-size:18px;font-weight:bold;color:#ffffff">{{BrandName}}</td>
</tr></table>
</td></tr>
<tr><td style="padding:32px 32px 8px">
<p style="margin:0 0 6px;font-size:13px;font-weight:bold;color:{{Accent}};text-transform:uppercase;letter-spacing:.6px">{{Eyebrow}}</p>
<h1 style="margin:0 0 12px;font-size:26px;line-height:32px;color:#10212f">{{Title}}</h1>
<p style="margin:0;font-size:15px;line-height:22px;color:#475865">{{Intro}}</p>
</td></tr>
{{Sections}}
<tr><td style="height:32px;line-height:32px;font-size:0">&nbsp;</td></tr>
<tr><td style="padding:20px 32px;background:#f5f7f9;font-size:12px;line-height:18px;color:#657179">{{BrandName}}<br>{{FooterNote}}</td></tr>
</table>
</td></tr></table>
</body>
</html>
