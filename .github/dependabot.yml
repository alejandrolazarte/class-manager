# Dependency updates. Security updates are enabled in the repository settings;
# this file adds monthly version updates. See docs/dependency-and-secret-scanning.md.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Analyzers must target a Roslyn no newer than the compiler in the .NET SDK that loads them.
      - dependency-name: Microsoft.CodeAnalysis.*
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      app-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # The Expo SDK pins these; they move together with `pnpm expo install --fix`.
      # React and React Native libraries are pinned to exact versions, patches included.
      - dependency-name: expo
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: expo-*
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@expo/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-dom
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      e2e-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Matches the Node major the e2e suite runs on (CI uses node-version 22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
