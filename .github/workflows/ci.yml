name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore class-manager.slnx

      - run: dotnet build class-manager.slnx --no-restore -warnaserror

      - run: dotnet format class-manager.slnx --verify-no-changes --no-restore

      - run: dotnet test class-manager.slnx --no-build --verbosity normal

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: docker build --file src/Api/Containerfile --tag class-manager-api:ci .

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm test --ci

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: E2e-Throwaway-Password-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P E2e-Throwaway-Password-1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: e2e
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      E2E_DATABASE_CONNECTION_STRING: Server=tcp:localhost,1433;Database=ClassManagerE2E;User Id=sa;Password=E2e-Throwaway-Password-1;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml', 'e2e/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-e2e-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm format:check

      - run: pnpm exec playwright install --with-deps chromium

      - run: dotnet restore ../class-manager.slnx

      - run: pnpm db:migrate

      - run: pnpm web:build

      - run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
