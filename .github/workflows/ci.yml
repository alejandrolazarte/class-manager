name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: areas
        if: github.event_name == 'pull_request'
        run: git diff --name-only HEAD^1 HEAD | scripts/ci-changed-areas.sh >> "$GITHUB_OUTPUT"

  backend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore class-manager.slnx

      - run: dotnet build class-manager.slnx --no-restore -warnaserror

      - run: dotnet test class-manager.slnx --no-build --verbosity normal

  backend-format:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - run: dotnet restore class-manager.slnx

      - run: dotnet format class-manager.slnx --verify-no-changes --no-restore

  container:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.backend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: docker build --file src/Api/Containerfile --tag class-manager-api:ci .

      - run: docker build --file src/Backoffice.Api/Containerfile --tag class-manager-backoffice-api:ci .

  frontend:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      - run: pnpm knip

      - run: pnpm test --ci

      - run: pnpm export:web

      - run: pnpm export:backoffice

      - run: pnpm check:bundles

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: E2e-Throwaway-Password-1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P E2e-Throwaway-Password-1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: e2e
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      E2E_DATABASE_CONNECTION_STRING: Server=tcp:localhost,1433;Database=ClassManagerE2E;User Id=sa;Password=E2e-Throwaway-Password-1;TrustServerCertificate=True
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: corepack enable

      - id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-e2e-${{ runner.os }}-${{ hashFiles('app/pnpm-lock.yaml', 'e2e/pnpm-lock.yaml') }}
          restore-keys: pnpm-store-e2e-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm format:check

      - name: Start Azurite for the audit log
        run: >-
          docker run --detach
          --publish 10000:10000 --publish 10001:10001 --publish 10002:10002
          mcr.microsoft.com/azure-storage/azurite:3.37.0
          azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0
          --skipApiVersionCheck --inMemoryPersistence

      - run: pnpm exec playwright install --with-deps chromium

      - run: dotnet restore ../class-manager.slnx

      - run: pnpm db:migrate

      - run: pnpm web:build

      - run: pnpm exec playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
