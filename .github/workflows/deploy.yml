name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-pilot
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/alejandrolazarte/class-manager-api
  BACKOFFICE_IMAGE_NAME: ghcr.io/alejandrolazarte/class-manager-backoffice-api
  DEPLOYED_SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  image:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin

      - run: >-
          docker build
          --file src/Api/Containerfile
          --build-arg "SOURCE_REVISION=$DEPLOYED_SHA"
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=$DEPLOYED_SHA"
          --tag "$IMAGE_NAME:$DEPLOYED_SHA"
          .

      - run: docker push "$IMAGE_NAME:$DEPLOYED_SHA"

      - if: vars.AZURE_BACKOFFICE_CONTAINER_APP != ''
        run: >-
          docker build
          --file src/Backoffice.Api/Containerfile
          --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}"
          --label "org.opencontainers.image.revision=$DEPLOYED_SHA"
          --tag "$BACKOFFICE_IMAGE_NAME:$DEPLOYED_SHA"
          .

      - if: vars.AZURE_BACKOFFICE_CONTAINER_APP != ''
        run: docker push "$BACKOFFICE_IMAGE_NAME:$DEPLOYED_SHA"

  api:
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
      AZURE_SQL_SERVER: ${{ vars.AZURE_SQL_SERVER }}
      AZURE_SQL_DATABASE: ${{ vars.AZURE_SQL_DATABASE }}
      FIREWALL_RULE_NAME: github-deploy-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Sign in to Azure with OpenID Connect
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          federated_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq --raw-output .value)
          echo "::add-mask::$federated_token"
          az login --service-principal --username "$DEPLOY_CLIENT_ID" --tenant "$DEPLOY_TENANT_ID" \
            --federated-token "$federated_token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Open the database firewall to this runner
        run: |
          runner_ip=$(curl --fail --silent --show-error https://api.ipify.org)
          az sql server firewall-rule create --resource-group "$AZURE_RESOURCE_GROUP" --server "$AZURE_SQL_SERVER" \
            --name "$FIREWALL_RULE_NAME" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none

      - name: Apply database migrations
        env:
          MIGRATIONS_CONNECTION_STRING: >-
            Server=tcp:${{ vars.AZURE_SQL_SERVER }}.database.windows.net,1433;Database=${{ vars.AZURE_SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60;ConnectRetryCount=6;ConnectRetryInterval=20
        run: node scripts/migrate-database.mjs

      - name: Close the database firewall
        if: always()
        run: |
          az sql server firewall-rule delete --resource-group "$AZURE_RESOURCE_GROUP" --server "$AZURE_SQL_SERVER" \
            --name "$FIREWALL_RULE_NAME" --output none || true

      - name: Deploy the image
        run: |
          az containerapp update --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$IMAGE_NAME:$DEPLOYED_SHA" --output none

      - name: Wait for the API to answer
        run: |
          api_host=$(az containerapp show --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 60 \
            "https://$api_host/health"

  web:
    needs: api
    if: vars.AZURE_STATIC_WEB_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_STATIC_WEB_APP: ${{ vars.AZURE_STATIC_WEB_APP }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      FILES_BASE_URL: ${{ vars.FILES_BASE_URL }}
      EXPO_PUBLIC_PLANS_CONTACT_URL: ${{ vars.EXPO_PUBLIC_PLANS_CONTACT_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      EXPO_PUBLIC_SENTRY_RELEASE: ${{ github.event.workflow_run.head_sha }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ vars.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ vars.SENTRY_APP_PROJECT }}
      STATIC_WEB_APPS_CLI: "@azure/static-web-apps-cli@2.0.10"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the web app
        working-directory: app
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm export:web

      - name: Upload source maps to Sentry
        if: env.SENTRY_AUTH_TOKEN != ''
        working-directory: app
        run: pnpm exec sentry-cli sourcemaps upload --release "$EXPO_PUBLIC_SENTRY_RELEASE" dist/_expo

      - name: Remove source maps from the published files
        working-directory: app
        run: find dist -name "*.map" -delete

      - name: Sign in to Azure with OpenID Connect
        run: |
          federated_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq --raw-output .value)
          echo "::add-mask::$federated_token"
          az login --service-principal --username "$DEPLOY_CLIENT_ID" --tenant "$DEPLOY_TENANT_ID" \
            --federated-token "$federated_token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Deploy the web app
        working-directory: app
        run: |
          deployment_token=$(az staticwebapp secrets list --name "$AZURE_STATIC_WEB_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey --output tsv)
          echo "::add-mask::$deployment_token"
          npx --yes "$STATIC_WEB_APPS_CLI" deploy dist --env production --deployment-token "$deployment_token"

  backoffice-api:
    needs: [image, api]
    if: vars.AZURE_BACKOFFICE_CONTAINER_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_BACKOFFICE_CONTAINER_APP: ${{ vars.AZURE_BACKOFFICE_CONTAINER_APP }}
    steps:
      - name: Sign in to Azure with OpenID Connect
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
          federated_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq --raw-output .value)
          echo "::add-mask::$federated_token"
          az login --service-principal --username "$DEPLOY_CLIENT_ID" --tenant "$DEPLOY_TENANT_ID" \
            --federated-token "$federated_token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Deploy the image
        run: |
          az containerapp update --name "$AZURE_BACKOFFICE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --image "$BACKOFFICE_IMAGE_NAME:$DEPLOYED_SHA" --output none

      - name: Wait for the backoffice API to answer
        run: |
          api_host=$(az containerapp show --name "$AZURE_BACKOFFICE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors --max-time 60 \
            "https://$api_host/health"

  backoffice-web:
    needs: backoffice-api
    if: vars.AZURE_BACKOFFICE_STATIC_WEB_APP != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      DEPLOY_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_BACKOFFICE_STATIC_WEB_APP: ${{ vars.AZURE_BACKOFFICE_STATIC_WEB_APP }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.BACKOFFICE_API_BASE_URL }}
      STATIC_WEB_APPS_CLI: "@azure/static-web-apps-cli@2.0.10"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOYED_SHA }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Build the backoffice web app
        working-directory: app
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm export:backoffice

      - name: Sign in to Azure with OpenID Connect
        run: |
          federated_token=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq --raw-output .value)
          echo "::add-mask::$federated_token"
          az login --service-principal --username "$DEPLOY_CLIENT_ID" --tenant "$DEPLOY_TENANT_ID" \
            --federated-token "$federated_token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"

      - name: Deploy the backoffice web app
        working-directory: app
        run: |
          deployment_token=$(az staticwebapp secrets list --name "$AZURE_BACKOFFICE_STATIC_WEB_APP" \
            --resource-group "$AZURE_RESOURCE_GROUP" --query properties.apiKey --output tsv)
          echo "::add-mask::$deployment_token"
          npx --yes "$STATIC_WEB_APPS_CLI" deploy dist-backoffice --env production --deployment-token "$deployment_token"
